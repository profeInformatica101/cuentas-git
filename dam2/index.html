<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos GitHub</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center mb-4"><i class="fa-brands fa-github"></i> Alumnos de <mark>Desarrollo de Aplicaciones Multiplataforma</mark>  (DAM2)</h1>
        <input type="text" id="filtro" class="form-control mb-3" placeholder="Filtrar por nombre de usuario de GitHub" onkeyup="filtrarAlumnos()">
        <div id="tabla-container"></div>
    </div>

    <script>

const alumnos = [
    { "github_user": "ananuflo", "info": "NF, A" },
    { "github_user": "elanziismael", "info": "EE, I" },
    { "github_user": "Manuel-es", "info": "EA, M" },
    { "github_user": "danielbl-67", "info": "BL, D" },
    { "github_user": "teresaGB22", "info": "GB, T" },
    { "github_user": "palomo-02", "info": "PZ, J" },
    { "github_user": "robertskrr", "info": "EV, R" },
    { "github_user": "Silviamg9", "info": "MG, S" },
    { "github_user": "JoseManuelOrtega", "info": "OA, J" },
    { "github_user": "jmmorsan", "info": "MS, J" },
    { "github_user": "germanlledo0303", "info": "LLP, G" },
    { "github_user": "JooseeSS", "info": "SS, JA" },
];
        // Función para generar la tabla de alumnos
        function generarTabla(alumnosFiltrados) {
            let tablaHTML = `
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Usuario de GitHub</th>
                            <th>Mi-Web-Estática</th>
                         <!--   <th>GIT_Prueba</th> -->
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Genera las filas de la tabla
            alumnosFiltrados.forEach((alumno, index) => {
                const usuario = alumno.github_user;
                const info = alumno.info;
                const enlaceGitHub = `https://github.com/${usuario}`;
                const enlaceMiWebEstatica = `https://${usuario}.github.io/mi-web-estatica`;

             
                tablaHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><a href="${enlaceGitHub}" target="_blank">${usuario}</a></td>
                        <td><a href="${enlaceMiWebEstatica}" target="_blank">${info}</a></td>
                      
                 
                    </tr>
                `;
            });

            tablaHTML += `
                    </tbody>
                </table>
            `;

            // Inserta la tabla en el contenedor
            document.getElementById('tabla-container').innerHTML = tablaHTML;
        }

        // Función para filtrar la lista de alumnos
        function filtrarAlumnos() {
            const filtro = document.getElementById('filtro').value.toLowerCase();
            const alumnosFiltrados = alumnos.filter(alumno => alumno.github_user.toLowerCase().includes(filtro));
            generarTabla(alumnosFiltrados);
        }

        // Genera la tabla inicial con todos los alumnos
        generarTabla(alumnos);
    </script>
</body>
</html>
