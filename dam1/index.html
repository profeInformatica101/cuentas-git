<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos GitHub</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center mb-4"><i class="fa-brands fa-github"></i> Alumnos de <mark>Desarrollo de Aplicaciones Multiplataforma</mark></h1>
        <input type="text" id="filtro" class="form-control mb-3" placeholder="Filtrar por nombre de usuario de GitHub" onkeyup="filtrarAlumnos()">
        <div id="tabla-container"></div>
    </div>

    <script>
        const alumnos = [
    { "github_user": "robertofrancobarrios", "info": "FB, R" },
    { "github_user": "JooseeSS", "info": "SS, J" },
    { "github_user": "joseca331", "info": "BG, J" },
    { "github_user": "Adri-marq", "info": "ML, A" },
    { "github_user": "ivan-alcaide", "info": "AR, I" },
    { "github_user": "Gabriel23clases", "info": "GL, G" },
    { "github_user": "albamachuk", "info": "MP, A" },
    { "github_user": "CobosAdrian-kiwi", "info": "CF, A" },
    { "github_user": "JuanjoVoutrinas", "info": "TM, P" },
    { "github_user": "huetecobosmiguel-cloud", "info": "HC, M" },
    { "github_user": "SHA1456", "info": "HA, S" },
    { "github_user": "", "info": "LP, G" },
    { "github_user": "msierraufano", "info": "SU, M" },
    { "github_user": "", "info": "MB, A" },
    { "github_user": "Alvaro-Dorado", "info": "DC, A" },
    { "github_user": "JaviCG2006", "info": "CG, J" },
];

        // Función para generar la tabla de alumnos
        function generarTabla(alumnosFiltrados) {
            let tablaHTML = `
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Usuario de GitHub</th>
                            <th>Mi-Web-Estática</th>
                         <!--   <th>GIT_Prueba</th> -->
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Genera las filas de la tabla
            alumnosFiltrados.forEach((alumno, index) => {
                const usuario = alumno.github_user;
                const info = alumno.info;
                const enlaceGitHub = `https://github.com/${usuario}`;
                const enlaceMiWebEstatica = `https://${usuario}.github.io/mi-web-estatica`;

             
                tablaHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><a href="${enlaceGitHub}" target="_blank">${usuario}</a></td>
                        <td><a href="${enlaceMiWebEstatica}" target="_blank">${info}</a></td>
                      
                 
                    </tr>
                `;
            });

            tablaHTML += `
                    </tbody>
                </table>
            `;

            // Inserta la tabla en el contenedor
            document.getElementById('tabla-container').innerHTML = tablaHTML;
        }

        // Función para filtrar la lista de alumnos
        function filtrarAlumnos() {
            const filtro = document.getElementById('filtro').value.toLowerCase();
            const alumnosFiltrados = alumnos.filter(alumno => alumno.github_user.toLowerCase().includes(filtro));
            generarTabla(alumnosFiltrados);
        }

        // Genera la tabla inicial con todos los alumnos
        generarTabla(alumnos);
    </script>
</body>
</html>
